[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobilerun-sandbox"
version = "0.2.0"
description = "Script interface for Mobilerun sandbox scripts: typed entry point, Context, inspect and run."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.11"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["mobilerun_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

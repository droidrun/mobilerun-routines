name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"  # never re-resolve; the lock is pinned by age
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No package younger than 7 days
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"  # uv release of 2026-10-27
          python-version: "3.13"
      - name: Tag is on main and matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG is not on main" >&2
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          sdk_version=$(python3 -c 'import re; print(re.search(r"SDK_VERSION = \"([^\"]+)\"", open("mobilerun_sandbox/_version.py").read()).group(1))')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match pyproject version v$version" >&2
            exit 1
          fi
          if [ "$sdk_version" != "$version" ]; then
            echo "SDK_VERSION $sdk_version does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest
      - run: uv build
      - name: Wheel holds only the package
        shell: bash
        run: |
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "expected exactly one wheel" >&2; exit 1; }
          unzip -Z1 "${wheels[0]}" | tee /dev/stderr | awk '
            /\.pth$/ || /sitecustomize/ { print "forbidden wheel path: " $0 > "/dev/stderr"; bad = 1; next }
            /^mobilerun_sandbox\// { next }
            /^mobilerun_sandbox-[^\/]*\.dist-info\// { next }
            { print "unexpected wheel path: " $0 > "/dev/stderr"; bad = 1 }
            END { if (NR == 0) { print "empty wheel listing" > "/dev/stderr"; bad = 1 } exit bad }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
